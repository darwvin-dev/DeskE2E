<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>DeskE2E Smoke Fixture</title>
<style>body{font:16px system-ui;background:#eff6ff;color:#142138;padding:32px;max-width:540px;margin:auto}button,input{padding:10px;margin-top:6px;border-radius:5px}</style></head><body>
<h1>DeskE2E Test Application</h1>
<label for="name">Display name</label>
<input id="name" data-testid="name" value="" />
<button data-testid="save">Save</button>
<p data-testid="status" role="status">Not saved</p>
<script>
  document.querySelector('[data-testid="save"]').addEventListener('click', () => {
    document.querySelector('[data-testid="status"]').textContent = `Saved: ${document.querySelector('#name').value}`;
  });
</script>
</body></html>
